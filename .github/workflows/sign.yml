name: Sign

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Immutable URL from build summary (e.g. https://storage.googleapis.com/<bucket>?generation=12345)'
        required: true
      sha256:
        description: 'SHA-256 of dist/index.html printed by the same build run'
        required: true

jobs:
  sign:
    name: Sign config.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read

    steps:
      - name: Check out web-bootloader
        uses: actions/checkout@v6
        with:
          repository: grodno-grab/web-bootloader

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch the page and verify its build provenance
        env:
          URL: ${{ inputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL "$URL" -o page.html
          gh attestation verify page.html --repo ${{ github.repository }}

      - name: Write signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" > /tmp/signing.key

      - name: Sign
        env:
          URL: ${{ inputs.url }}
          SHA256: ${{ inputs.sha256 }}
        run: npm run sign -- --url "$URL" --file page.html --sha256 "$SHA256" --keys /tmp/signing.key

      - name: Upload config.json artifact
        uses: actions/upload-artifact@v7
        with:
          name: config.json
          path: config.json

      - name: Clean up signing key
        if: always()
        run: rm -f /tmp/signing.key
